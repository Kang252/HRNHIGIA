services:
  - type: web
    name: nhigia-hrm
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    # SQL connectivity is critical for login and HRM workflows. Full schema
    # readiness remains available separately at /Health.
    healthCheckPath: /Health/Database
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__MainConnectionString
        sync: false
