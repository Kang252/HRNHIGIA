name: NHIGIA API and Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: NestJS API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NHIGIA.Api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: NHIGIA.Api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke tests
        run: npm run test:smoke

  client:
    name: React client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NHIGIA.Modern/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: NHIGIA.Modern/ClientApp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
